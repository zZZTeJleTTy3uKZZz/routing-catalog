name: release

on:
  push:
    branches: [main]
    paths: ["catalog/**", "schema.json", "scripts/**"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Build and validate
        run: python3 scripts/build.py dist
      - name: Verify checksums
        run: cd dist && sha256sum -c *.sha256sum
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(date -u +%Y%m%d%H%M)"
          gh release create "$tag" dist/* --title "$tag" --notes "Автоматическая сборка каталога"
